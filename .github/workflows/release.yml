name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish the package after all verification succeeds
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run check
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run complete browser suite
        run: npm run test:e2e
      - name: Verify release readiness
        run: npm run release:check -- --dry-run

  publish:
    needs: verify
    if: github.event_name == 'release' || inputs.confirm == true
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build:dist
      - name: Re-verify release inputs
        run: npm run release:check -- --dry-run
      - name: Publish with provenance
        run: npm publish --provenance --access public --tag alpha

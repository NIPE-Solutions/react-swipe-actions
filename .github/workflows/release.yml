name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish the package after all verification succeeds
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-nipe-solutions-react-swipe-actions-alpha
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tarball: ${{ steps.release.outputs.tarball }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run check
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run complete browser suite
        run: npm run test:e2e
      - name: Verify and preserve release artifact
        id: release
        run: npm run release:check -- --dry-run --output release-artifact
      - name: Upload verified release artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-alpha
          path: release-artifact
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: verify
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.confirm == true)
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download verified release artifact
        uses: actions/download-artifact@v7
        with:
          name: npm-package-alpha
          path: release-artifact
      - name: Verify promoted artifact checksum
        working-directory: release-artifact
        run: sha512sum --check --strict "${{ needs.verify.outputs.tarball }}.sha512"
      - name: Publish verified artifact with provenance
        run: npm publish "release-artifact/${{ needs.verify.outputs.tarball }}" --ignore-scripts --provenance --access public --tag "${{ needs.verify.outputs.channel }}"

name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish the package after all verification succeeds
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-nipe-solutions-react-swipe-actions-alpha
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tarball: ${{ steps.release.outputs.tarball }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run check
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify live website and axe
        run: npm run verify:website:browser
      - name: Run complete browser suite
        run: npm run test:e2e
      - name: Verify and preserve release artifact
        id: release
        run: npm run release:check -- --dry-run --output release-artifact
      - name: Upload verified release artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-alpha
          path: release-artifact
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: verify
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.confirm == true)
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download verified release artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package-alpha
          path: release-artifact
      - name: Validate and publish verified artifact
        env:
          RELEASE_TARBALL: ${{ needs.verify.outputs.tarball }}
          RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
        working-directory: release-artifact
        run: |
          set -euo pipefail

          if [[ "$RELEASE_CHANNEL" != "alpha" ]]; then
            echo "Release channel must be alpha" >&2
            exit 1
          fi

          expected_tarball="nipe-solutions-react-swipe-actions-0.1.0-alpha.0.tgz"
          if [[ ! "$RELEASE_TARBALL" =~ ^[A-Za-z0-9._-]+$ ]] || [[ "$RELEASE_TARBALL" != "$expected_tarball" ]]; then
            echo "Unsafe release tarball: expected $expected_tarball" >&2
            exit 1
          fi

          manifest="${RELEASE_TARBALL}.sha512"
          shopt -s nullglob
          manifests=(*.sha512)
          if (( ${#manifests[@]} != 1 )) || [[ "${manifests[0]}" != "$manifest" ]]; then
            echo "Checksum manifest name must exactly match $manifest" >&2
            exit 1
          fi
          if [[ ! -f "$RELEASE_TARBALL" ]] || [[ ! -f "$manifest" ]]; then
            echo "Verified tarball or checksum manifest is missing" >&2
            exit 1
          fi
          if [[ "$(wc -l < "$manifest")" -ne 1 ]]; then
            echo "Checksum manifest must contain exactly one entry" >&2
            exit 1
          fi

          manifest_line="$(<"$manifest")"
          if [[ ! "$manifest_line" =~ ^([[:xdigit:]]{128})[[:space:]][[:space:]]([A-Za-z0-9._-]+)$ ]]; then
            echo "Checksum manifest must contain one SHA-512 entry" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[2]}" != "$RELEASE_TARBALL" ]]; then
            echo "Checksum manifest filename must match the release tarball" >&2
            exit 1
          fi

          sha512sum --check --strict -- "$manifest"
          npm publish --ignore-scripts --provenance --access public --tag "$RELEASE_CHANNEL" -- "$RELEASE_TARBALL"

name: Browsers

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-chromium-
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Chromium
        run: npm run test:e2e -- --project=chromium --reporter=line,html
      - name: Upload Chromium failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chromium-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-firefox-
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Test Firefox
        run: npm run test:e2e -- --project=firefox --reporter=line,html
      - name: Upload Firefox failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-firefox-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-webkit-
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Test WebKit
        run: npm run test:e2e -- --project=webkit --reporter=line,html
      - name: Upload WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
